name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── 1. Build & Test ────────────────────────────────────────────────────────
  build-and-test:
    name: Build & Test (Java 17)
    runs-on: ubuntu-latest

    # Testcontainers spins up its own PostgreSQL container, so no service
    # block is needed here — Docker is available on ubuntu-latest runners.

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission to Gradle wrapper
        run: chmod +x gradlew

      # Build the fat jar; skip tests here — they run in the next step so
      # we get a separate, clearly labelled test report.
      - name: Build jar (skip tests)
        run: ./gradlew bootJar --no-daemon -x test

      # Full test run. Testcontainers will pull and start the postgres image
      # automatically inside the runner's Docker daemon.
      - name: Run tests
        run: ./gradlew test --no-daemon
        env:
          # Testcontainers needs the Docker socket
          TESTCONTAINERS_RYUK_DISABLED: "true"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/test/
          retention-days: 14

      # Cache the built jar for the docker-build job so we don't rebuild
      - name: Upload application jar
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/libs/*.jar
          retention-days: 1

  # ── 2. Build & Push Docker Image ──────────────────────────────────────────
  docker-build-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test

    # Only publish images on pushes to main, not on pull requests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download application jar
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: build/libs/

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Re-use the already-built jar; skip the gradle step inside Docker
          # by passing a build arg that the Dockerfile can optionally respect.
          # The multi-stage build will still work as-is since the jar is present.
          cache-from: type=gha
          cache-to: type=gha,mode=max
